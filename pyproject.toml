[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qatool"
version = "0.1.0"
description = "HiFi assembly QA: read recruitment and diagnostic plotting"
readme = "README.md"
requires-python = ">=3.11"          # tomllib
# qaview: bokeh draws, fastapi/uvicorn serve the page, edlib and parasail align
# the stretches under a shift+drag rectangle.
dependencies = [
    "pysam",
    "pandas",
    "numpy",
    "matplotlib",
    "bokeh>=3.9,<4",
    "numba",                    # the compiled pair-HMM engine; scoring is ~28x slower without
    "fastapi",
    "uvicorn",
    "edlib",
    "parasail",
]

[project.scripts]
qaview = "qaview.__main__:main"

[project.optional-dependencies]
# kept so `pip install .[view]` / `.[model]` still work; both are in the defaults now
view = []
model = []

[[project.authors]]
name = "Anton Zamyatin"
email = "zamyatin.anton@gmail.com"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qaview = ["static/*"]
