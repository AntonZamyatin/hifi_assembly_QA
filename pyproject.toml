[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qatool"
version = "0.1.0"
description = "HiFi assembly QA: read recruitment and diagnostic plotting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pysam",
    "pandas",
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
view = ["bokeh", "panel"]
# The compiled pair-HMM engine. Without it qamodel still works;
# forward_window is the same recursion in numpy, about 28x slower.
model = ["numba"]

[[project.authors]]
name = "Anton Zamyatin"
email = "zamyatin.anton@gmail.com"

[tool.setuptools.packages.find]
where = ["src"]
