[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qatool"
version = "0.1.0"
description = "HiFi assembly QA: read recruitment and diagnostic plotting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pysam",
    "pandas",
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
# qaview: bokeh draws, fastapi/uvicorn serve the page, edlib and parasail align
# the stretches under a shift+drag rectangle; panel runs the older app
# (src/qaview/app.py).
view = ["bokeh", "fastapi", "uvicorn", "edlib", "parasail", "panel"]
# The compiled pair-HMM engine. Without it qamodel still works;
# forward_window is the same recursion in numpy, about 28x slower.
model = ["numba"]

[[project.authors]]
name = "Anton Zamyatin"
email = "zamyatin.anton@gmail.com"

[tool.setuptools.packages.find]
where = ["src"]
