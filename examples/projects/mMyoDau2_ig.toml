# qaview project: mMyoDau2 reference against its LJA assembly over the IG loci
# (IGH, IGL), the analysis of examples/analysis/mMyoDau2_*.ipynb (generate_notebooks.py).
# Written by examples/scripts/make_projects.py. Paths are relative to this file.

name = "mMyoDau2_ig"

[asm1]                                    # Delta S > 0 favours asm1
name  = "ref"
fasta = "../bgz/mMyoDau2.ref.fasta.bgz"
bam   = "../alignments/mMyoDau2.ref.sorted.bam"

[asm2]
name  = "lja"
fasta = "../bgz/mMyoDau2.lja.fasta.bgz"
bam   = "../alignments/mMyoDau2.lja.sorted.bam"

[data]
db = "../dbs/mMyoDau2.aln.sqlite"
library_assembly = "ref"                  # lambda reference; keep fixed across loci

[[seeds]]
format   = "bed"
path     = "seeds/mMyoDau2_ig.bed"
assembly = "ref"

[recruitment]                             # hg002_hic's values, with the anchor extension
pid_threshold    = 0.997
plen_threshold   = 0.999
best_pid_delta   = 0.001
merge_gap        = 50000
extension_window = 100
ext_max          = 300000
ext_rounds       = 100
max_rounds       = 100
extension        = "anchor"

[resources]
recruit_workers = 32
score_workers   = 32

[output]
dir = "../analysis/mMyoDau2"
